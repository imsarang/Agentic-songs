services:
  redis:
    image: redis/redis-stack-server:7.4.0-v3
    # :6380 on host so ./host/run.sh can write wire features (host :6379 often taken)
    ports:
      - "6380:6379"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      GF_INSTALL_PLUGINS: redis-datasource
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    restart: unless-stopped

  # Spotify, commented for now.
  # spotify:
  #   build: ./mcp
  #   env_file: ./mcp/.env
  #   environment:
  #     SPOTIFY_DATA_DIR: /data
  #     MCP_TRANSPORT: http
  #     MCP_ADDR: ":8080"
  #     SPOTIFY_IN_DOCKER: "1"
  #   volumes:
  #     - ${SHANKS_SPOTIFY_DIR:-${HOME}/.config/shanks}:/data
  #   ports:
  #     - "8080:8080"
  #     - "4381:4381"

  # Google, commented for now.
  # google:
  #   build:
  #     context: ./mcp
  #     args:
  #       BIN: google
  #   env_file: ./mcp/.env
  #   environment:
  #     GOOGLE_DATA_DIR: /data
  #     MCP_TRANSPORT: http
  #     MCP_ADDR: ":8080"
  #     GOOGLE_IN_DOCKER: "1"
  #     GOOGLE_OPEN_URL: http://host.docker.internal:4390/open
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   volumes:
  #     - ${SHANKS_SPOTIFY_DIR:-${HOME}/.config/shanks}:/data
  #   ports:
  #     - "8004:8080"
  #     - "4382:4382"

  # ReAct agent — LLM may be host LM Studio via host.docker.internal
  agent:
    build: ./agent
    env_file: ./agent/.env
    environment:
      AGENT_HOST: "0.0.0.0"
      AGENT_PORT: "8001"
      # MCP_URL: http://spotify:8080/mcp
      # MACHINE_MCP_URL: http://host.docker.internal:8092/mcp
      # GOOGLE_MCP_URL: http://google:8080/mcp
      RETRIEVE_MCP_URL: http://retriever:8093/mcp
      REDIS_URL: redis://redis:6379/0
      # Reach LM Studio / Ollama on the host (overrides 127.0.0.1 from .env)
      LOCAL_BASE_URL: http://host.docker.internal:1234/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"
    depends_on:
      # - spotify
      # - google
      - retriever
      - grafana
      - redis
    restart: unless-stopped

  # Terminal REPL — interactive only: docker compose run --rm ui
  ui:
    profiles: ["ui"]
    build: ./ui
    environment:
      AGENT_TURN_URL: http://agent:8001/turn
      THREAD_ID: default
    depends_on:
      - agent
    stdin_open: true
    tty: true

  # Study retrieval. Qdrant and the embed server run on the host.
  retriever:
    image: shanks-mcp-py
    build:
      context: .
      dockerfile: mcp-py/Dockerfile
      args:
        UID: 1000
        GID: 1000
    command: ["python", "/app/mcp-py/cmd/retriever/main.py"]
    user: "1000:1000"
    environment:
      MCP_TRANSPORT: http
      MCP_ADDR: ":8093"
      QDRANT_URL: http://host.docker.internal:6333
      EMBED_URL: http://host.docker.internal:8091/embed
      REDIS_URL: redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8093:8093"
    restart: unless-stopped
