services:
  redis:
    image: redis:7.4-alpine
    container_name: shanks-crawl-redis
    command: redis-server --appendonly yes
    ports:
      - "6391:6379"
    volumes:
      - crawl-redis:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: shanks-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    restart: unless-stopped

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: shanks-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: shanks
      MINIO_ROOT_PASSWORD: shanks-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

  crawl:
    build: ./crawl
    container_name: shanks-crawl
    env_file: ./crawl/.env
    environment:
      PYTHONUNBUFFERED: "1"
      S3_ENDPOINT: http://minio:9000
      CELERY_BROKER_URL: redis://redis:6379/1
      SOURCES_PATH: /app/config/sources.yaml
    depends_on:
      - minio
      - redis
    volumes:
      - ./crawl/config:/app/config:ro
    restart: "no"

volumes:
  qdrant-storage:
  crawl-redis:
