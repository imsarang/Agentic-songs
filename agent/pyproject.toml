[project]
name = "shanks-agent"
version = "0.1.0"
description = "Shanks ReAct agent server"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.0",
  "mcp>=1.0.0,<2",
  "httpx>=0.28.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-anthropic>=0.3.0",
  "langgraph>=0.2.0"
]

[project.scripts]
shanks-agent = "shanks_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shanks_agent"]