[project]
name = "shanks-worker"
version = "0.1.0"
description = "Read a stored document, embed it, and upsert Qdrant"
requires-python = ">=3.11"
dependencies = [
  "celery[redis]>=5",
  "boto3>=1.35.0",
  "httpx>=0.28.0",
  "sentence-transformers>=3",
  "qdrant-client>=1.13",
]

[project.scripts]
worker = "worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
