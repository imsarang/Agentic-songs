services:
  catalog:
    image: pgvector/pgvector:pg17
    container_name: shanks-ecommerce-catalog
    environment:
      - POSTGRES_USER=shanks
      - POSTGRES_PASSWORD=value
      - POSTGRES_DB=catalog
    ports:
      - "5433:5432"
    volumes:
      - catalog-data:/var/lib/postgresql/data
      - ./database/catalog.sql:/docker-entrypoint-initdb.d/01-catalog.sql:ro
    restart: unless-stopped

  prices:
    image: postgres:17
    container_name: shanks-ecommerce-prices
    environment:
      - POSTGRES_USER=shanks
      - POSTGRES_PASSWORD=value
      - POSTGRES_DB=prices
    ports:
      - "5434:5432"
    volumes:
      - prices-data:/var/lib/postgresql/data
      - ./database/price_history.sql:/docker-entrypoint-initdb.d/01-price_history.sql:ro
    restart: unless-stopped
volumes:
  catalog-data:
  prices-data: