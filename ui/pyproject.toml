[project]
name = "shanks-ui"
version = "0.1.0"
description = "Shanks terminal client"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.0",
  "rich>=13.9.0",
]

[project.scripts]
shanks-ui = "shanks_ui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shanks_ui"]